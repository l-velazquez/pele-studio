<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write Mermaid, pick a theme, export presentation-ready diagrams. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>Pele Studio</title>
    <script>
      try {
        var a = localStorage.getItem('pele-studio:appearance')
        if (a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
